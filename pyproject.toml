[project]
name = "saas-bench"
version = "0.1.0"
description = "SaaS Bench - AI subscription service benchmark"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.109.1",
    "boto3>=1.42.41",
    "cryptography>=46.0.3",
    "fastapi>=0.133.1",
    "markdown>=3.10.1",
    "matplotlib>=3.10.8",
    "mcp>=1.0.0",
    "modal>=1.4.2",
    "numpy>=2.4.1",
    "openai>=2.15.0",
    "pandas>=2.3.3",
    "portkey-ai>=2.3.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "reportlab>=4.4.9",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    # sqlcipher3-binary 仅提供 Linux x86_64 wheel；Linux ARM64 使用
    # sqlcipher3 已发布的 aarch64 wheel，避免 Lima ARM64 选错依赖包。
    "sqlcipher3-binary>=0.6.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sqlcipher3>=0.6.2 ; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "uvicorn>=0.40.0",
    "weasyprint>=68.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/saas_bench"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib 模式允许不同测试目录使用相同文件名，与生产模块镜像组织。
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = [
    "slow: 执行时间明显较长，不进入日常快速回归",
    "linux: 仅在 Linux 环境执行",
    "bwrap: 依赖 Bubblewrap 沙箱",
    "external: 会访问真实外部服务，默认测试入口不执行",
]
