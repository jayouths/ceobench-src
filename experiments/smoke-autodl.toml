# AutoDL Smoke Test：只运行 7 天，验证 AutoDL API、工具调用、成本记录与主实验链路。
# API Key 仅从仓库根目录 .env 的 AUTODL_API_KEY 读取。

[experiment]
seed = 42
days = 7
scenario = "default"
initial_cash = 1000000.0
workspace = "bash_agent_runs"
label = "smoke-autodl-deepseek-v4"
max_decision_turns_per_batch = 100
max_invalid_responses_per_turn = 3

# Smoke 默认只验证原始 Baseline 链路。
[modules.analysis]
enabled = false

# Pro 使用已验证可访问的固定版本请求名；实际服务模型由响应的 model 字段记录。
[models.decision_agent]
provider = "openai_compatible"
api_type = "openai_chat_completions"
model = "deepseek-v4-pro-202606"
base_url = "https://www.autodl.art/api/v1"
api_key_env = "AUTODL_API_KEY"
api_key_required = true
reasoning_effort = "low"
max_output_tokens = 16384
timeout_seconds = 600

# AutoDL 请求名和实际服务名都映射到 DeepSeek 官方模型。
[models.decision_agent.pricing_model_map]
"deepseek-v4-pro-202606" = "deepseek-v4-pro"
"DeepSeek-V4-Pro" = "deepseek-v4-pro"
"DeepSeek-V4-Pro-0813" = "deepseek-v4-pro"

# DeepSeek 2026-08-17 00:00（北京时间）起的官方峰时价，固定作为保守、可复现的论文计价口径。
# 来源：https://api-docs.deepseek.com/quick_start/pricing
[models.decision_agent.pricing."deepseek-v4-pro"]
currency = "USD"
uncached_input_cost_per_million = 1.32
cached_input_cost_per_million = 0.044
output_cost_per_million = 3.96

# 社交环境生成短文本，使用低成本的 V4 Flash，并显式关闭思考。
[models.social_llm]
provider = "openai_compatible"
api_type = "openai_chat_completions"
model = "DeepSeek-V4-Flash"
base_url = "https://www.autodl.art/api/v1"
api_key_env = "AUTODL_API_KEY"
api_key_required = true
reasoning_effort = "none"
temperature = 0.95
max_output_tokens = 1000
timeout_seconds = 600

[models.social_llm.pricing_model_map]
"DeepSeek-V4-Flash" = "deepseek-v4-flash"
"deepseek-v4-flash-202605" = "deepseek-v4-flash"
"DeepSeek-V4-Flash-0731" = "deepseek-v4-flash"

# DeepSeek 2026-08-17 00:00（北京时间）起的官方峰时价，单位：美元/百万 Token。
# 来源：https://api-docs.deepseek.com/quick_start/pricing
[models.social_llm.pricing."deepseek-v4-flash"]
currency = "USD"
uncached_input_cost_per_million = 0.44
cached_input_cost_per_million = 0.014
output_cost_per_million = 1.32

[models.social_llm.tasks.customer_post]
max_output_tokens = 1000

[models.social_llm.tasks.macro_post]
max_output_tokens = 300

[models.social_llm.tasks.competitor_post]
max_output_tokens = 300

[models.social_llm.tasks.agent_post_judge]
temperature = 0.3
max_output_tokens = 100

[models.social_llm.tasks.agent_post_reply]
temperature = 0.9
max_output_tokens = 150
