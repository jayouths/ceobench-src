# DeepSeek Smoke Test：只运行 7 天，验证官方 API、工具调用、成本记录与主实验链路。
# API Key 仅从仓库根目录 .env 的 DEEPSEEK_API_KEY 读取。

[experiment]
seed = 42
days = 7
scenario = "default"
initial_cash = 1000000.0
workspace = "bash_agent_runs"
label = "smoke-deepseek-v4"
max_decision_turns_per_batch = 100
max_invalid_responses_per_turn = 3

# Smoke 默认只验证原始 Baseline 链路。
[modules.analysis]
enabled = false
max_schema_retries = 1                  # JSON Schema 校验失败后的最大修复次数
max_enterprise_threads = 50             # signals.json 最多保留的开放企业谈判明细数

# 决策 Agent 需要稳定的工具调用能力，使用 V4 Pro 的低强度思考模式。
[models.decision_agent]
provider = "openai_compatible"
api_type = "openai_responses"
model = "deepseek-v4-pro"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
api_key_required = true
reasoning_effort = "low"
max_output_tokens = 16384
timeout_seconds = 600

# DeepSeek 2026-08-17 00:00（北京时间）起的官方峰时价，固定作为保守、可复现的论文计价口径。
# 来源：https://api-docs.deepseek.com/quick_start/pricing
[models.decision_agent.pricing."deepseek-v4-pro"]
currency = "USD"
uncached_input_cost_per_million = 1.32
cached_input_cost_per_million = 0.044
output_cost_per_million = 3.96

# 社交环境主要生成短文本，使用成本更低的 V4 Flash，并显式关闭思考。
[models.social_llm]
provider = "openai_compatible"
api_type = "openai_responses"
model = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
api_key_required = true
reasoning_effort = "none"
temperature = 0.95
max_output_tokens = 1000
timeout_seconds = 600

[models.social_llm.pricing."deepseek-v4-flash"]
currency = "USD"
uncached_input_cost_per_million = 0.44
cached_input_cost_per_million = 0.014
output_cost_per_million = 1.32

[models.social_llm.tasks.customer_post]
max_output_tokens = 1000

[models.social_llm.tasks.macro_post]
max_output_tokens = 300

[models.social_llm.tasks.competitor_post]
max_output_tokens = 300

[models.social_llm.tasks.agent_post_judge]
temperature = 0.3
max_output_tokens = 100

[models.social_llm.tasks.agent_post_reply]
temperature = 0.9
max_output_tokens = 150

# Analysis 四角色只做结构化状态识别，使用低成本 Flash 并关闭思考。
[models.analysis]
provider = "openai_compatible"
api_type = "openai_responses"
model = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
api_key_required = true
reasoning_effort = "none"
temperature = 0.2
max_output_tokens = 5000
timeout_seconds = 600

[models.analysis.pricing."deepseek-v4-flash"]
currency = "USD"
uncached_input_cost_per_million = 0.44
cached_input_cost_per_million = 0.014
output_cost_per_million = 1.32

[models.analysis.tasks.role_report]
max_output_tokens = 3000

[models.analysis.tasks.state_reconstruction]
max_output_tokens = 4000
