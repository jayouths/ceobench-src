# Smoke Test 配置：只运行 7 天，用于验证安装、模型连接和主链路是否正常。
# 所有实验参数和模型调用参数只在本文件中配置，CLI 不支持覆盖。

[experiment]
# CEO-Bench 按周推进，本配置正好运行一周。
seed = 42                               # 环境随机种子
days = 7                                # 计划模拟天数
scenario = "default"                    # 已注册的模拟场景名
initial_cash = 1000000.0                # 企业初始现金，单位：美元
workspace = "bash_agent_runs"           # 实验产物根目录
label = "smoke-qwen-coder"              # 实验展示标签，不影响模拟规则
max_decision_turns_per_batch = 100      # 单个决策批次的最大 Agent 行动数
max_invalid_responses_per_turn = 3      # 单次行动允许的连续无效模型输出数

# Smoke 默认只验证原始 Baseline 链路。
[modules.analysis]
enabled = false
max_schema_retries = 1                  # JSON Schema 校验失败后的最大修复次数
max_enterprise_threads = 50             # signals.json 最多保留的开放企业谈判明细数

# 决策 Agent：读取经营信息、调用工具并做出每周经营决策。
[models.decision_agent]
provider = "openai_compatible"           # 客户端类型；Ollama 使用 openai_compatible
api_type = "openai_responses"            # API 协议，不根据 URL 或模型名推断
tool_choice = "required"                  # 决策模型每次响应必须包含工具调用
model = "qwen3-coder:30b"                # 请求模型名
base_url = "http://localhost:11434/v1"   # OpenAI 兼容接口地址
api_key_env = "OPENAI_API_KEY"           # API Key 环境变量名，不在此写入密钥
api_key_required = false                 # 是否强制校验 API Key
temperature = 0.7                        # 采样温度
top_p = 0.8                              # 核采样阈值
max_output_tokens = 16384                # 单次响应最大输出 Token
timeout_seconds = 600                    # 单次请求超时，单位：秒

# Token 单价表。表名必须使用服务端实际返回的模型名；金额使用供应商结算币种。
[models.decision_agent.pricing."qwen3-coder:30b"]
currency = "CNY"                        # 三位大写币种代码；本地模型仅用于统一记录
uncached_input_cost_per_million = 0.0    # 未命中缓存的输入单价；本地模型填 0
cached_input_cost_per_million = 0.0      # 命中缓存的输入单价；本地模型填 0
output_cost_per_million = 0.0            # 输出单价；本地模型填 0

# 社交环境 LLM：生成客户帖子、宏观帖子、竞品帖子，并评估 Agent 帖子。
[models.social_llm]
provider = "openai_compatible"           # 客户端类型
api_type = "openai_responses"            # API 协议
model = "qwen3-coder:30b"                # 请求模型名
base_url = "http://localhost:11434/v1"   # OpenAI 兼容接口地址
api_key_env = "OPENAI_API_KEY"           # API Key 环境变量名
api_key_required = false                 # 是否强制校验 API Key
temperature = 0.95                       # 默认采样温度，社交文本需要一定多样性
max_output_tokens = 1000                 # 任务未覆盖时的默认输出上限
timeout_seconds = 600                    # 单次请求超时，单位：秒

[models.social_llm.pricing."qwen3-coder:30b"]
currency = "CNY"                        # 三位大写币种代码；本地模型仅用于统一记录
uncached_input_cost_per_million = 0.0    # 未命中缓存的输入单价；本地模型填 0
cached_input_cost_per_million = 0.0      # 命中缓存的输入单价；本地模型填 0
output_cost_per_million = 0.0            # 输出单价；本地模型填 0

[models.social_llm.tasks.customer_post]  # 普通客户社交媒体帖子
max_output_tokens = 1000                 # 输出上限

[models.social_llm.tasks.macro_post]     # 宏观经济相关帖子
max_output_tokens = 300                  # 输出上限

[models.social_llm.tasks.competitor_post] # 竞争对手产品事件帖子
max_output_tokens = 300                   # 输出上限

[models.social_llm.tasks.agent_post_judge] # 从客户群体视角评价 Agent 帖子
temperature = 0.3                          # 低温度以提高稳定性
max_output_tokens = 100                    # 输出上限

[models.social_llm.tasks.agent_post_reply] # 客户对高影响力 Agent 帖子的简短回复
temperature = 0.9                          # 采样温度
max_output_tokens = 150                    # 输出上限

# reasoning_effort 未配置，因此请求中不发送 reasoning 参数。
# 如需启用，应在对应模型或任务表中显式填写；Anthropic 应改用 request_options。
